          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case opc_source_overlay_one_part_save \
            --json target/perf/opc-source-overlay-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/opc-source-overlay-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          result = report["results"][0]
          assert result["case"] == "opc_source_overlay_one_part_save"
          assert result["corpus"]["archive_sha256"] == "a0c1af9e2c7a19148b44fc2a8c594c7a274131d74f9f042d55b487d5337cd1e6"
          assert result["corpus"]["archive_member_count"] == 6
          assert result["corpus"]["uncompressed_payload_bytes"] == 16_777_216
          assert result["output_sha256"] == "f4bbe4de18853444cc6cd093cf561249decaa81f776afcf5de122667f5dd7009"
          assert result["source"]["ordinary_payload_materializations"] == [1]
          assert result["sink"]["accepted_bytes"] == 16_783_632
          assert result["sink"]["largest_write"] <= 65_536
          assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run source-backed DOCX semantic publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case docx_source_backed_one_edit_save \
            --json target/perf/docx-source-edit-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/docx-source-edit-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          result = report["results"][0]
          assert result["case"] == "docx_source_backed_one_edit_save"
          assert result["corpus"]["archive_sha256"] == "a4a2e4921235a6da6b38e31d26ddcca1301909885e37330ab4f83ecc0c4e04f4"
          assert result["corpus"]["entry_count"] == 17
          assert result["corpus"]["archive_member_count"] == 20
          assert result["corpus"]["uncompressed_payload_bytes"] == 16_833_643
          assert result["output_sha256"] == "9af99bf7f63aac1ffc13ff59a5038703c96229b906b3db1602d5af5590171795"
          assert result["source"]["ordinary_payload_materializations"] == [1]
          assert result["sink"]["accepted_bytes"] == 16_793_048
          assert result["sink"]["largest_write"] <= 65_536
          assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run source-backed PPTX semantic publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case pptx_source_backed_one_edit_save \
            --json target/perf/pptx-source-edit-smoke.json
          python3 - <<'PY'
          import json
