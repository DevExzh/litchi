                  return
              buckets = sink["write_size_buckets"]
              assert set(buckets) == SINK_BUCKET_KEYS
              assert sum(buckets.values()) == sink["write_calls"]

          report = json.loads(Path("target/perf/container-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 198
          assert len({item["case"] for item in report["results"]}) == 36
