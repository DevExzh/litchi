          report = json.loads(Path("target/perf/pptx-source-edit-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          result = report["results"][0]
          assert result["case"] == "pptx_source_backed_one_edit_save"
          assert result["corpus"]["archive_sha256"] == "61b2b99083ca27ebd37955db600955e3f41289b93dba71951983164239eff757"
          assert result["corpus"]["entry_count"] == 229
          assert result["corpus"]["archive_member_count"] == 445
          assert result["corpus"]["uncompressed_payload_bytes"] == 17_568_429
          assert result["output_sha256"] == "bcfd05dc7590051137db64810db2d822ac814417c03c50d8a7fc33f429e50d61"
          assert result["source"]["ordinary_payload_materializations"] == [2]
          assert result["sink"]["accepted_bytes"] == 17_017_144
          assert result["sink"]["largest_write"] <= 65_536
          assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run XLSX calculation-metadata publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case xlsx_eager_calculation_metadata_edit_save,xlsx_source_backed_calculation_metadata_edit_save \
            --json target/perf/xlsx-calculation-edit-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/xlsx-calculation-edit-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 2
          results = {result["case"]: result for result in report["results"]}
          eager = results["xlsx_eager_calculation_metadata_edit_save"]
          source = results["xlsx_source_backed_calculation_metadata_edit_save"]
          for result in results.values():
              assert result["corpus"]["archive_sha256"] == "c11a9424accfc6ce56e4deb6ecb18a2142d2f0076395018ef00ba93897049f7c"
              assert result["corpus"]["entry_count"] == 12
              assert result["corpus"]["archive_member_count"] == 17
              assert result["corpus"]["uncompressed_payload_bytes"] == 16_782_412
              assert result["output_sha256"] == "96f60a09a8e87204a533e178bdda115b0202e8aa8ac4fe5673a881f981d3e98d"
              assert result["sink"]["accepted_bytes"] == 16_786_830
              assert result["sink"]["largest_write"] <= 65_536
              assert len(result["elapsed_ns"]["samples"]) == 1
          assert eager["source"]["ordinary_payload_materializations"] == [12]
          assert source["source"]["ordinary_payload_materializations"] == [1]
          PY

      - name: Run XLSX page-break publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case xlsx_eager_page_break_edit_save,xlsx_source_backed_page_break_edit_save \
            --json target/perf/xlsx-page-break-edit-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/xlsx-page-break-edit-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 2
          results = {result["case"]: result for result in report["results"]}
          eager = results["xlsx_eager_page_break_edit_save"]
          source = results["xlsx_source_backed_page_break_edit_save"]
          for result in results.values():
              assert result["corpus"]["archive_sha256"] == "c11a9424accfc6ce56e4deb6ecb18a2142d2f0076395018ef00ba93897049f7c"
              assert result["corpus"]["entry_count"] == 12
              assert result["corpus"]["archive_member_count"] == 17
              assert result["corpus"]["uncompressed_payload_bytes"] == 16_782_412
              assert result["output_sha256"] == "1e3b7a9f763feaed4ad4888aa8aa0cd3773cdb9fd9f12e16f3c05b7fd0cd95b3"
              assert result["sink"]["accepted_bytes"] == 16_786_878
              assert result["sink"]["largest_write"] <= 65_536
              assert len(result["elapsed_ns"]["samples"]) == 1
              assert result["source"]["ordinary_payload_read_calls"][0] > 0
              assert result["source"]["ordinary_payload_read_bytes"][0] > 0
          assert eager["source"]["ordinary_payload_materializations"] == [12]
          assert source["source"]["ordinary_payload_materializations"] == [2]
          PY

      - name: Run ODP media publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case odp_media_textbox_edit_save \
            --json target/perf/odp-media-textbox-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/odp-media-textbox-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          result = report["results"][0]
          assert result["case"] == "odp_media_textbox_edit_save"
          assert result["corpus"]["entry_count"] == 20
          assert result["corpus"]["uncompressed_payload_bytes"] == 16_778_260
          assert result["corpus"]["archive_sha256"] == "c5e98dac88846d7b8264f0af4e893d80e21672222c35c3b8890f78cff53242d3"
          assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run ODT media paragraph publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case odt_media_paragraph_edit_save \
            --json target/perf/odt-media-paragraph-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/odt-media-paragraph-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          result = report["results"][0]
          assert result["case"] == "odt_media_paragraph_edit_save"
          assert result["corpus"]["entry_count"] == 208
          assert result["corpus"]["uncompressed_payload_bytes"] == 16_787_016
          assert result["corpus"]["archive_sha256"] == "097b17ebc8fe811888eba6a9a7d118bc94bb99651880782ccecedf93c003b5ed"
          assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run native OLE2 semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case doc_semantic_open,doc_semantic_list_paragraphs,doc_semantic_one_paragraph,doc_semantic_full_text,doc_semantic_noop_edit_save,doc_semantic_one_edit_save,xls_semantic_open,xls_semantic_list_worksheets,xls_semantic_one_cell,xls_semantic_full_cell_scan,xls_semantic_noop_edit_save,xls_semantic_one_edit_save,ppt_semantic_open,ppt_semantic_list_slides,ppt_semantic_one_shape_text,ppt_semantic_full_text,ppt_slide_order_snapshot_open,ppt_text_edit_one_edit_save,ppt_semantic_noop_edit_save,ppt_semantic_one_edit_save \
