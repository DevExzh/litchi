              ("rtf_semantic_move_paragraph_save", "large"): (
                  "5feae6e5bd27751d75c936a5ae9f57e00d391d7759557e07c535227c72f3cf7c",
                  "6f6a12a8f44580bd2a3b243306e49e185931079d3abe369b780fe82d4d111f27",
                  540008,
              ),
          }
          for item in lifecycle:
              key = (item["case"], item["corpus"]["shape"])
              source_sha256, output_sha256, output_bytes = expected[key]
              assert item["corpus"]["archive_sha256"] == source_sha256
              assert item["output_sha256"] == output_sha256
              assert item["sink"]["accepted_bytes"] == output_bytes
              assert item["sink"]["write_calls"] > 0
              assert item["sink"]["largest_write"] <= item["sink"]["accepted_bytes"]
              assert "source" not in item
          PY

