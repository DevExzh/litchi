name: Performance baseline

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/litchi-core/**'
      - 'crates/litchi-cfb/**'
      - 'crates/litchi-doc/**'
      - 'crates/litchi-docx/**'
      - 'crates/litchi-opc/**'
      - 'crates/litchi-odf-common/**'
      - 'crates/litchi-odp/**'
      - 'crates/litchi-ods/**'
      - 'crates/litchi-odt/**'
      - 'crates/litchi-ppt/**'
      - 'crates/litchi-pptx/**'
      - 'crates/litchi-rtf/**'
      - 'crates/litchi-xls/**'
      - 'crates/litchi-xlsx/**'
      - 'crates/soapberry-zip/**'
      - 'crates/xml-minifier/**'
      - 'tools/perf-baseline/**'
      - '.github/workflows/perf-baseline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/litchi-core/**'
      - 'crates/litchi-cfb/**'
      - 'crates/litchi-doc/**'
      - 'crates/litchi-docx/**'
      - 'crates/litchi-opc/**'
      - 'crates/litchi-odf-common/**'
      - 'crates/litchi-odp/**'
      - 'crates/litchi-ods/**'
      - 'crates/litchi-odt/**'
      - 'crates/litchi-ppt/**'
      - 'crates/litchi-pptx/**'
      - 'crates/litchi-rtf/**'
      - 'crates/litchi-xls/**'
      - 'crates/litchi-xlsx/**'
      - 'crates/soapberry-zip/**'
      - 'crates/xml-minifier/**'
      - 'tools/perf-baseline/**'
      - '.github/workflows/perf-baseline.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PERF_MANIFEST: tools/perf-baseline/Cargo.toml

jobs:
  smoke:
    name: deterministic container smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/perf-baseline -> tools/perf-baseline/target

      - name: Check standalone harness
        run: |
          cargo fmt --manifest-path "$PERF_MANIFEST" -- --check
          cargo check --locked --manifest-path "$PERF_MANIFEST"
          cargo test --locked --manifest-path "$PERF_MANIFEST"

      - name: Run deterministic smoke baseline
        run: |
          mkdir -p target/perf
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 2 \
            --shape tiny \
            --payload compressible \
            --writer-shape tiny \
            --xlsx-shape tiny \
            --json target/perf/opc-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/opc-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 36
          assert len({item["case"] for item in report["results"]}) == 36
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 2
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run XLSX commit/read attribution smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case xlsx_one_cell_commit_first_read \
            --xlsx-shape tiny \
            --json target/perf/xlsx-commit-read-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/xlsx-commit-read-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          assert report["results"][0]["case"] == "xlsx_one_cell_commit_first_read"
          assert len(report["results"][0]["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run DOCX/PPTX semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case docx_semantic_open,docx_semantic_list_paragraphs,docx_semantic_one_paragraph,docx_semantic_full_text,docx_semantic_create_small,docx_semantic_noop_edit_save,docx_semantic_one_edit_save,docx_semantic_one_percent_edit_save,pptx_semantic_open,pptx_semantic_list_slides,pptx_semantic_one_slide,pptx_semantic_full_text,pptx_semantic_create_small,pptx_semantic_noop_edit_save,pptx_semantic_one_edit_save,pptx_semantic_one_percent_edit_save \
            --semantic-shape tiny \
            --json target/perf/semantic-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/semantic-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 16
          assert len({item["case"] for item in report["results"]}) == 16
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 1
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run common OLE2 publication smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case ole_common_open,ole_common_put_stream_publish,ole_common_finish_render,ole_common_one_edit_save \
            --shape few-large \
            --payload incompressible \
            --json target/perf/ole-common-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/ole-common-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 4
          assert {result["case"] for result in report["results"]} == {
              "ole_common_open",
              "ole_common_put_stream_publish",
              "ole_common_finish_render",
              "ole_common_one_edit_save",
          }
          for result in report["results"]:
              assert result["corpus"]["entry_count"] == 5
              assert result["corpus"]["uncompressed_payload_bytes"] == 16_777_252
              assert result["corpus"]["archive_sha256"] == "7ffbd37c3e472a21b382bcbb02e430a62164e58d2270bbee0deaa584ff47a94d"
              assert len(result["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run source-backed OPC one-Part publication smoke
