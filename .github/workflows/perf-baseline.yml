  reference-regression:
    name: reference-gated hosted comparison
    if: github.event_name == 'workflow_dispatch' && inputs.reference_run_id != ''
    needs: full
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current hosted report
        uses: actions/download-artifact@v4
        with:
          name: container-performance-baseline-${{ github.run_id }}
          path: target/perf/current

      - name: Download explicit reference report
        uses: actions/download-artifact@v4
        with:
          name: container-performance-baseline-${{ inputs.reference_run_id }}
          path: target/perf/reference
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reference_run_id }}

      - name: Apply versioned performance regression policy
        run: |
          python3 tools/perf_compare.py \
            --policy docs/performance/perf-regression-policy-v1.json \
            --baseline target/perf/reference/container-baseline.json \
            --current target/perf/current/container-baseline.json \
            --json-out target/perf/comparison/perf-regression.json \
            --summary-out target/perf/comparison/perf-regression.txt

      - name: Upload comparison summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-comparison-${{ github.run_id }}
          path: target/perf/comparison/
          if-no-files-found: warn
          retention-days: 14
