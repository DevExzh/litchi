          assert {item["corpus"]["shape"] for item in lifecycle} == {"tiny", "large"}
          expected = {
              ("rtf_semantic_remove_paragraph_save", "tiny"): (
                  "73641cf09b630632deabce8585c67f395a6bd3ac01eedcca6a8b7224ef00d252",
