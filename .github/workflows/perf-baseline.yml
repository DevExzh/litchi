  full:
    name: release container matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/perf-baseline -> tools/perf-baseline/target

      - name: Build release harness
        run: cargo build --release --locked --manifest-path "$PERF_MANIFEST"

      - name: Run full release baseline matrix
        run: |
          mkdir -p target/perf
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --json target/perf/container-baseline.json
          python3 - <<'PY'
