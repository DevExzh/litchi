name: Performance baseline

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/litchi-core/**'
      - 'crates/litchi-cfb/**'
      - 'crates/litchi-doc/**'
      - 'crates/litchi-docx/**'
      - 'crates/litchi-opc/**'
      - 'crates/litchi-odf-common/**'
      - 'crates/litchi-odp/**'
      - 'crates/litchi-ods/**'
      - 'crates/litchi-odt/**'
      - 'crates/litchi-ppt/**'
      - 'crates/litchi-pptx/**'
      - 'crates/litchi-rtf/**'
      - 'crates/litchi-xls/**'
      - 'crates/litchi-xlsx/**'
      - 'crates/soapberry-zip/**'
      - 'crates/xml-minifier/**'
      - 'tools/perf-baseline/**'
      - '.github/workflows/perf-baseline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/litchi-core/**'
      - 'crates/litchi-cfb/**'
      - 'crates/litchi-doc/**'
      - 'crates/litchi-docx/**'
      - 'crates/litchi-opc/**'
      - 'crates/litchi-odf-common/**'
      - 'crates/litchi-odp/**'
      - 'crates/litchi-ods/**'
      - 'crates/litchi-odt/**'
      - 'crates/litchi-ppt/**'
      - 'crates/litchi-pptx/**'
      - 'crates/litchi-rtf/**'
      - 'crates/litchi-xls/**'
      - 'crates/litchi-xlsx/**'
      - 'crates/soapberry-zip/**'
      - 'crates/xml-minifier/**'
      - 'tools/perf-baseline/**'
      - '.github/workflows/perf-baseline.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PERF_MANIFEST: tools/perf-baseline/Cargo.toml

jobs:
  smoke:
    name: deterministic container smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/perf-baseline -> tools/perf-baseline/target

      - name: Check standalone harness
        run: |
          cargo fmt --manifest-path "$PERF_MANIFEST" -- --check
          cargo check --locked --manifest-path "$PERF_MANIFEST"
          cargo test --locked --manifest-path "$PERF_MANIFEST"

      - name: Run deterministic smoke baseline
        run: |
          mkdir -p target/perf
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 2 \
            --shape tiny \
            --payload compressible \
            --writer-shape tiny \
            --xlsx-shape tiny \
            --json target/perf/opc-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/opc-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 36
          assert len({item["case"] for item in report["results"]}) == 36
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 2
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run XLSX commit/read attribution smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case xlsx_one_cell_commit_first_read \
            --xlsx-shape tiny \
            --json target/perf/xlsx-commit-read-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/xlsx-commit-read-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 1
          assert report["results"][0]["case"] == "xlsx_one_cell_commit_first_read"
          assert len(report["results"][0]["elapsed_ns"]["samples"]) == 1
          PY

      - name: Run DOCX/PPTX semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case docx_semantic_open,docx_semantic_list_paragraphs,docx_semantic_one_paragraph,docx_semantic_full_text,docx_semantic_create_small,docx_semantic_noop_edit_save,docx_semantic_one_edit_save,docx_semantic_one_percent_edit_save,pptx_semantic_open,pptx_semantic_list_slides,pptx_semantic_one_slide,pptx_semantic_full_text,pptx_semantic_create_small,pptx_semantic_noop_edit_save,pptx_semantic_one_edit_save,pptx_semantic_one_percent_edit_save \
            --semantic-shape tiny \
            --json target/perf/semantic-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/semantic-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 16
          assert len({item["case"] for item in report["results"]}) == 16
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 1
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run native OLE2 semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case doc_semantic_open,doc_semantic_list_paragraphs,doc_semantic_one_paragraph,doc_semantic_full_text,doc_semantic_noop_edit_save,doc_semantic_one_edit_save,xls_semantic_open,xls_semantic_list_worksheets,xls_semantic_one_cell,xls_semantic_full_cell_scan,xls_semantic_noop_edit_save,xls_semantic_one_edit_save,ppt_semantic_open,ppt_semantic_list_slides,ppt_semantic_one_shape_text,ppt_semantic_full_text,ppt_slide_order_snapshot_open,ppt_text_edit_one_edit_save,ppt_semantic_noop_edit_save,ppt_semantic_one_edit_save \
            --writer-shape tiny \
            --json target/perf/ole2-semantic-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/ole2-semantic-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 20
          assert len({item["case"] for item in report["results"]}) == 20
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 1
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run ODF semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case odt_semantic_open,odt_semantic_list_paragraphs,odt_semantic_one_paragraph,odt_semantic_full_text,odt_semantic_create_small,odt_semantic_noop_edit_save,odt_semantic_one_edit_save,ods_semantic_open,ods_semantic_list_sheets,ods_semantic_one_cell,ods_semantic_cell_sweep,ods_semantic_full_cell_text,ods_semantic_create_small,ods_semantic_noop_edit_save,ods_semantic_one_edit_save,odp_semantic_open,odp_semantic_list_slides,odp_semantic_one_slide,odp_semantic_full_text,odp_semantic_create_small,odp_semantic_noop_edit_save,odp_semantic_one_edit_save \
            --semantic-shape tiny \
            --json target/perf/odf-semantic-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/odf-semantic-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 22
          assert len({item["case"] for item in report["results"]}) == 22
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 1
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run RTF semantic smoke
        run: |
          cargo run --locked --manifest-path "$PERF_MANIFEST" -- \
            --warmup 0 \
            --samples 1 \
            --case rtf_semantic_open,rtf_semantic_list_paragraphs,rtf_semantic_one_paragraph,rtf_semantic_full_text,rtf_semantic_stream_save,rtf_semantic_noop_edit_save,rtf_semantic_one_edit_save \
            --semantic-shape tiny \
            --rtf-variant plain,byte1252,lzfu,watermark \
            --json target/perf/rtf-semantic-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/rtf-semantic-smoke.json").read_text())
          assert report["schema_version"] == 1
          assert report["configuration"]["rtf_variants"] == [
              "plain", "byte1252", "lzfu", "watermark"
          ]
          assert len(report["results"]) == 25
          assert len({item["case"] for item in report["results"]}) == 7
          assert len({
              (item["case"], item["corpus"]["rtf_variant"], item["corpus"]["shape"])
              for item in report["results"]
          }) == 25
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 1
              assert item["corpus"]["archive_sha256"]
          PY

  full:
    name: release container matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/perf-baseline -> tools/perf-baseline/target

      - name: Build release harness
        run: cargo build --release --locked --manifest-path "$PERF_MANIFEST"

      - name: Run full release baseline matrix
        run: |
          mkdir -p target/perf
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --json target/perf/container-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/container-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 198
          assert len({item["case"] for item in report["results"]}) == 36
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 15
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run release XLSX commit/read attribution matrix
        run: |
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --case xlsx_one_cell_commit_first_read \
            --xlsx-shape tiny,medium,dense-wide \
            --json target/perf/xlsx-commit-read-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/xlsx-commit-read-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 3
          assert {item["corpus"]["shape"] for item in report["results"]} == {"tiny", "medium", "dense-wide"}
          for item in report["results"]:
              assert item["case"] == "xlsx_one_cell_commit_first_read"
              assert len(item["elapsed_ns"]["samples"]) == 15
          PY

      - name: Run release DOCX/PPTX semantic matrix
        run: |
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --case docx_semantic_open,docx_semantic_list_paragraphs,docx_semantic_one_paragraph,docx_semantic_full_text,docx_semantic_create_small,docx_semantic_noop_edit_save,docx_semantic_one_edit_save,docx_semantic_one_percent_edit_save,pptx_semantic_open,pptx_semantic_list_slides,pptx_semantic_one_slide,pptx_semantic_full_text,pptx_semantic_create_small,pptx_semantic_noop_edit_save,pptx_semantic_one_edit_save,pptx_semantic_one_percent_edit_save \
            --semantic-shape tiny,large \
            --json target/perf/semantic-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/semantic-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 30
          assert len({item["case"] for item in report["results"]}) == 16
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 15
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run release native OLE2 semantic matrix
        run: |
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --case doc_semantic_open,doc_semantic_list_paragraphs,doc_semantic_one_paragraph,doc_semantic_full_text,doc_semantic_noop_edit_save,doc_semantic_one_edit_save,xls_semantic_open,xls_semantic_list_worksheets,xls_semantic_one_cell,xls_semantic_full_cell_scan,xls_semantic_noop_edit_save,xls_semantic_one_edit_save,ppt_semantic_open,ppt_semantic_list_slides,ppt_semantic_one_shape_text,ppt_semantic_full_text,ppt_slide_order_snapshot_open,ppt_text_edit_one_edit_save,ppt_semantic_noop_edit_save,ppt_semantic_one_edit_save \
            --writer-shape tiny,large \
            --json target/perf/ole2-semantic-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/ole2-semantic-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 40
          assert len({item["case"] for item in report["results"]}) == 20
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 15
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run release ODF semantic matrix
        run: |
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --case odt_semantic_open,odt_semantic_list_paragraphs,odt_semantic_one_paragraph,odt_semantic_full_text,odt_semantic_create_small,odt_semantic_noop_edit_save,odt_semantic_one_edit_save,ods_semantic_open,ods_semantic_list_sheets,ods_semantic_one_cell,ods_semantic_cell_sweep,ods_semantic_full_cell_text,ods_semantic_create_small,ods_semantic_noop_edit_save,ods_semantic_one_edit_save,odp_semantic_open,odp_semantic_list_slides,odp_semantic_one_slide,odp_semantic_full_text,odp_semantic_create_small,odp_semantic_noop_edit_save,odp_semantic_one_edit_save \
            --semantic-shape tiny,large \
            --json target/perf/odf-semantic-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/odf-semantic-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert len(report["results"]) == 41
          assert len({item["case"] for item in report["results"]}) == 22
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 15
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Run release RTF semantic matrix
        run: |
          cargo run --release --locked --manifest-path "$PERF_MANIFEST" -- \
            --samples 15 \
            --case rtf_semantic_open,rtf_semantic_list_paragraphs,rtf_semantic_one_paragraph,rtf_semantic_full_text,rtf_semantic_stream_save,rtf_semantic_noop_edit_save,rtf_semantic_one_edit_save \
            --semantic-shape tiny,large \
            --rtf-variant plain,byte1252,lzfu,watermark \
            --json target/perf/rtf-semantic-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/perf/rtf-semantic-baseline.json").read_text())
          assert report["schema_version"] == 1
          assert report["configuration"]["rtf_variants"] == [
              "plain", "byte1252", "lzfu", "watermark"
          ]
          assert len(report["results"]) == 44
          assert len({item["case"] for item in report["results"]}) == 7
          assert len({
              (item["case"], item["corpus"]["rtf_variant"], item["corpus"]["shape"])
              for item in report["results"]
          }) == 44
          for item in report["results"]:
              assert len(item["elapsed_ns"]["samples"]) == 15
              assert item["corpus"]["archive_sha256"]
          PY

      - name: Upload performance baseline JSON
        uses: actions/upload-artifact@v4
        with:
          name: container-performance-baseline-${{ github.run_id }}
          path: |
            target/perf/container-baseline.json
            target/perf/xlsx-commit-read-baseline.json
            target/perf/ole2-semantic-baseline.json
            target/perf/semantic-baseline.json
            target/perf/odf-semantic-baseline.json
            target/perf/rtf-semantic-baseline.json
          if-no-files-found: error
          retention-days: 14
