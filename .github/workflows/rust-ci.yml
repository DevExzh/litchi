name: Rust Code Quality CI

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'crates/**'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '.cargo/**'
      - 'tools/**'
      - '.github/**'
      - 'deny.toml'
      - 'clippy.toml'
      - '.pre-commit-config.yaml'
      - 'rustfmt.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-ci.yml'
      - 'README.md'
      - 'crates/**/README.md'
      - 'crates/**/docs/**'
      - 'docs/FEATURE_MATRIX.md'
      - 'docs/OFFICE_API_GUIDE.md'
      - 'docs/adr/**'
      - 'test-data/libreoffice-core/**'
      - 'test-data/odf/**'
      - 'test-data/office-interop/**'
      - 'test-data/ole/**'
      - 'test-data/ooxml/**'
      - 'test-data/poi/**'
      - 'test-data/**'
      - 'tools/check_crate_boundaries.py'
      - 'tools/check_numbers_public_dependencies.py'
      - 'tools/crate_boundaries.json'
      - 'tools/test_check_crate_boundaries.py'
      - 'tools/test_check_numbers_public_dependencies.py'
      - 'tools/non_iwork_gate.py'
      - 'tools/test_non_iwork_gate.py'
      - 'tools/native_odf_resave.py'
      - 'tools/test_native_odf_resave.py'
      - 'docs/performance/BASELINE.md'
    branches:
      - main
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'crates/**'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '.cargo/**'
      - 'tools/**'
      - '.github/**'
      - 'deny.toml'
      - 'clippy.toml'
      - '.pre-commit-config.yaml'
      - 'rustfmt.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-ci.yml'
      - 'README.md'
      - 'crates/**/README.md'
      - 'crates/**/docs/**'
      - 'docs/FEATURE_MATRIX.md'
      - 'docs/OFFICE_API_GUIDE.md'
      - 'docs/adr/**'
      - 'test-data/libreoffice-core/**'
      - 'test-data/odf/**'
      - 'test-data/office-interop/**'
      - 'test-data/ole/**'
      - 'test-data/ooxml/**'
      - 'test-data/poi/**'
      - 'test-data/**'
      - 'tools/check_crate_boundaries.py'
      - 'tools/check_numbers_public_dependencies.py'
      - 'tools/crate_boundaries.json'
      - 'tools/test_check_crate_boundaries.py'
      - 'tools/test_check_numbers_public_dependencies.py'
      - 'tools/non_iwork_gate.py'
      - 'tools/test_non_iwork_gate.py'
      - 'tools/native_odf_resave.py'
      - 'tools/test_native_odf_resave.py'
      - 'docs/performance/BASELINE.md'
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  architecture:
    name: crate dependency boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test dependency-direction gate
        run: python3 -m unittest tools/test_check_crate_boundaries.py

      - name: Check dependency direction
        run: python3 tools/check_crate_boundaries.py

      - name: Test Numbers public-dependency gate
        run: python3 -m unittest tools/test_check_numbers_public_dependencies.py

      - name: Check Numbers public dependencies
        run: python3 tools/check_numbers_public_dependencies.py

      - name: Verify checked native-resave evidence
        run: python3 -m unittest tools.test_native_odf_resave

  non-iwork-release-gate:
    name: non-iWork release gate
    runs-on: ubuntu-latest
    env:
      # Keep this separate from the workspace-wide target; the gate is
      # serialized to make its resource envelope predictable.
      CARGO_TARGET_DIR: target/non-iwork-gate
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install non-iWork system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libfreetype6-dev libfontconfig1-dev
          version: 1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Test release-gate planner
        run: python3 -m unittest tools.test_non_iwork_gate

      - name: Print and verify non-iWork topology
        run: |
          python3 tools/non_iwork_gate.py print
          python3 tools/non_iwork_gate.py verify

      - name: Check non-iWork workspace and safe facade
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/check.json check

      - name: Lint non-iWork workspace and safe facade
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/clippy.json clippy

      - name: Build non-iWork documentation
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/doc.json doc

      - name: Run non-iWork library and integration tests
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/lib-tests.json lib-tests

      - name: Run non-iWork documentation tests
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/doc-tests.json doc-tests

      - name: Reject deprecated non-iWork API use
        run: python3 tools/non_iwork_gate.py --record-file target/non-iwork-gate-reports/deprecated.json deprecated

      - name: Upload non-iWork gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-iwork-gate-reports
          path: target/non-iwork-gate-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  portable-foundations:
    name: foundation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test portable foundations
        run: >-
          cargo test
          -p litchi-codepage
          -p litchi-core
          -p litchi-crypto
          -p litchi-doc
          -p litchi-docx
          -p litchi-drawingml
          -p litchi-fonts
          -p litchi-odraw
          -p litchi-ograph
          -p litchi-ole-common
          -p litchi-opc
          -p litchi-ooxml-common
          -p litchi-ppt
          -p litchi-pptx
          -p litchi-sheet
          -p litchi-sign
          -p litchi-slide
          -p litchi-vba
          -p litchi-word
          -p litchi-xls
          -p litchi-xlsb
          -p litchi-xlsx

  check-and-clippy:
    name: cargo check + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler pkg-config libfreetype6-dev libfontconfig1-dev
          version: 1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.toml sorting
        run: cargo sort --workspace --check

      - name: Check if code is compilable
        run: cargo check --workspace --all-features --lib --tests

      - name: Reject deprecated API use in every target
        env:
          RUSTFLAGS: -D deprecated
        run: cargo check --workspace --all-targets --all-features

      - name: Check minimal font and PPT capability boundaries
        run: |
          for package in litchi-docx litchi-ppt litchi-pptx; do
            cargo check -p "$package" --no-default-features
            cargo check -p "$package" --no-default-features --features fonts
            cargo check -p "$package" --no-default-features --features font-subset
            cargo check -p "$package" --no-default-features --features font-discovery
            cargo check -p "$package" --no-default-features --features automatic-fonts
          done
          cargo check -p litchi --no-default-features --features ppt
          cargo check -p litchi --no-default-features --features ppt,fonts
          cargo check -p litchi --no-default-features --features ppt,sign
          cargo check -p litchi-docx --no-default-features --features vba-inspection
          cargo check -p litchi-ppt --no-default-features --features vba-inspection
          cargo check -p litchi-pptx --no-default-features --features vba-inspection
          cargo check -p litchi-xlsb --no-default-features --features vba-inspection
          cargo check -p litchi-xlsx --no-default-features --features vba-inspection
          cargo check -p litchi --no-default-features --features docx,vba-inspection
          cargo check -p litchi --no-default-features --features ppt,vba-inspection
          cargo check -p litchi --no-default-features --features pptx,vba-inspection
          cargo check -p litchi --no-default-features --features xlsb,vba-inspection
          cargo check -p litchi --no-default-features --features xlsx,vba-inspection

      - name: Check optional OOXML encryption boundaries
        run: |
          set -euo pipefail
          for package in litchi-xlsx litchi-pptx; do
            if cargo tree -p "$package" --no-default-features --edges normal | rg -q 'litchi-crypto'; then
              echo "$package unexpectedly enables litchi-crypto without encryption" >&2
              exit 1
            fi
            cargo tree -p "$package" --no-default-features --features encryption --edges normal \
              | rg -q 'litchi-crypto'
          done
          for feature in xlsx pptx; do
            if cargo tree -p litchi --no-default-features --features "$feature" --edges normal \
              | rg -q 'litchi-crypto'; then
              echo "litchi unexpectedly enables litchi-crypto with bare $feature" >&2
              exit 1
            fi
          done
          cargo check -p litchi --no-default-features --features xlsx
          cargo check -p litchi --no-default-features --features pptx
          cargo test -p litchi --no-default-features --features xlsx,encryption \
            --test encryption_facade
          cargo test -p litchi --no-default-features --features pptx,encryption \
            --test encryption_facade

      - name: Enforce pinned Rust lint policy
        run: cargo lint

      - name: Reject rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check-and-clippy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler pkg-config libfreetype6-dev libfontconfig1-dev
          version: 1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --workspace --all-features --lib --tests

      - name: Run doc tests
        run: cargo test --workspace --all-features --doc
