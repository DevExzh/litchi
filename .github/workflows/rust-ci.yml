name: Rust Code Quality CI

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
      - 'docs/adr/**'
      - 'tools/check_crate_boundaries.py'
      - 'tools/crate_boundaries.json'
      - 'tools/test_check_crate_boundaries.py'
    branches:
      - main
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
      - 'docs/adr/**'
      - 'tools/check_crate_boundaries.py'
      - 'tools/crate_boundaries.json'
      - 'tools/test_check_crate_boundaries.py'
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  architecture:
    name: crate dependency boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test dependency-direction gate
        run: python3 -m unittest tools/test_check_crate_boundaries.py

      - name: Check dependency direction
        run: python3 tools/check_crate_boundaries.py

  portable-foundations:
    name: foundation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test portable foundations
        run: >-
          cargo test
          -p litchi-codepage
          -p litchi-core
          -p litchi-crypto
          -p litchi-drawingml
          -p litchi-odraw
          -p litchi-ograph
          -p litchi-ole-common
          -p litchi-ooxml-common
          -p litchi-sheet
          -p litchi-sign
          -p litchi-slide
          -p litchi-vba
          -p litchi-word
          -p litchi-xls
          -p litchi-xlsx

  check-and-clippy:
    name: cargo check + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler pkg-config libfreetype6-dev libfontconfig1-dev
          version: 1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.toml sorting
        run: cargo sort --workspace --check

      - name: Check if code is compilable
        run: cargo check --workspace --all-targets --all-features

      - name: Check if code adheres to best practices
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Reject rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check-and-clippy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler pkg-config libfreetype6-dev libfontconfig1-dev
          version: 1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --all-features --lib --tests

      - name: Run doc tests
        run: cargo test --all-features --doc
