[package]
name = "doc-retention-probe-0942-cfb-profile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "doc_retention_probe_0942_cfb_profile"
path = "src/main.rs"

[[bin]]
name = "doc_retention_probe_0942_cfb_profile_alloc"
path = "src/bin/alloc.rs"

[dependencies]
litchi-cfb = { path = "../../crates/litchi-cfb" }
litchi-core = { path = "../../crates/litchi-core" }
litchi-doc = { path = "../../crates/litchi-doc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
debug = 1
