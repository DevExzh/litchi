[package]
name = "unified-odt-paired-baseline"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["odt"]
odt = []

[dependencies]
litchi-core = { path = "../../../crates/litchi-core" }
litchi-odt = { path = "../../../crates/litchi-odt" }
litchi-ops = { path = "../../../crates/litchi-ops", default-features = false, features = ["odt"] }
serde_json = "1"

[[bin]]
name = "unified-odt-paired-baseline"
path = "../../../crates/litchi-ops/examples/odt_paired_bench.rs"

[profile.release]
debug = 1

[workspace]
