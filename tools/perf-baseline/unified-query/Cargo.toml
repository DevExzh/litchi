[package]
name = "unified-query-baseline"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Record 0287: compile the unified layer with every non-iWork format, as the
# `litchi` facade with all features does, so the unified `Node` has the size
# a full build gives it. Routes are unchanged.
all-formats = [
    "litchi-ops/doc",
    "litchi-ops/ppt",
    "litchi-ops/rtf",
    "litchi-ops/odt",
    "litchi-ops/ods",
    "litchi-ops/odp",
    "litchi-ops/odg",
]

[dependencies]
litchi-core = { path = "../../../crates/litchi-core" }
litchi-docx = { path = "../../../crates/litchi-docx" }
litchi-ops = { path = "../../../crates/litchi-ops", features = ["xlsx", "docx", "pptx", "xls", "xlsb"] }
litchi-xls = { path = "../../../crates/litchi-xls" }
litchi-xlsb = { path = "../../../crates/litchi-xlsb" }
litchi-pptx = { path = "../../../crates/litchi-pptx" }
litchi-xlsx = { path = "../../../crates/litchi-xlsx" }
serde_json = "1.0.154"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1

[workspace]
