[package]
name = "litchi-perf-baseline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
litchi-cfb = { path = "../../crates/litchi-cfb", features = ["write"] }
litchi-core = { path = "../../crates/litchi-core" }
litchi-doc = { path = "../../crates/litchi-doc" }
litchi-opc = { path = "../../crates/litchi-opc" }
litchi-ppt = { path = "../../crates/litchi-ppt" }
litchi-xls = { path = "../../crates/litchi-xls" }
litchi-xlsx = { path = "../../crates/litchi-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
soapberry-zip = { path = "../../crates/soapberry-zip" }

[workspace]
