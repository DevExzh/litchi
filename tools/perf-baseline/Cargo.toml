[package]
name = "litchi-perf-baseline"
version = "0.1.0"
edition = "2024"
publish = false

[features]
allocator-metrics = []
xls-source-attribution = ["litchi/xls"]
xlsb-crud = ["litchi/xlsb"]

[[bin]]
name = "litchi-perf-baseline-alloc"
path = "src/bin/litchi-perf-baseline-alloc.rs"
required-features = ["allocator-metrics"]

[[bin]]
name = "xlsb_crud"
path = "src/bin/xlsb_crud.rs"
required-features = ["xlsb-crud"]

[[bin]]
name = "xls_source_attribution"
path = "src/bin/xls_source_attribution.rs"
required-features = ["xls-source-attribution"]

[dependencies]
litchi-cfb = { path = "../../crates/litchi-cfb", features = ["write"] }
litchi-core = { path = "../../crates/litchi-core" }
litchi-doc = { path = "../../crates/litchi-doc", features = ["performance-diagnostics"] }
litchi-docx = { path = "../../crates/litchi-docx" }
litchi-odf-common = { path = "../../crates/litchi-odf-common" }
litchi-odraw = { path = "../../crates/litchi-odraw" }
litchi-odp = { path = "../../crates/litchi-odp" }
litchi-ods = { path = "../../crates/litchi-ods" }
litchi-odt = { path = "../../crates/litchi-odt" }
litchi-ole-common = { path = "../../crates/litchi-ole-common" }
litchi-ooxml-common = { path = "../../crates/litchi-ooxml-common" }
litchi-opc = { path = "../../crates/litchi-opc", features = ["sign", "performance-diagnostics"] }
litchi = { path = "../../crates/litchi", features = ["docx", "ods", "odt", "odp", "pptx", "rtf", "xlsx"] }
litchi-ppt = { path = "../../crates/litchi-ppt" }
litchi-pptx = { path = "../../crates/litchi-pptx" }
litchi-rtf = { path = "../../crates/litchi-rtf" }
litchi-sign = { path = "../../crates/litchi-sign" }
litchi-xls = { path = "../../crates/litchi-xls" }
litchi-xlsb = { path = "../../crates/litchi-xlsb" }
litchi-xlsx = { path = "../../crates/litchi-xlsx" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
soapberry-zip = { path = "../../crates/soapberry-zip" }
rustix = { version = "1.1.4", features = ["fs", "param"] }

[workspace]
