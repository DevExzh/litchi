[package]
name = "litchi-ooxml-common"
description = "Shared lossless OOXML vocabulary and preprocessing for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
encryption = ["dep:litchi-crypto", "litchi-crypto/ooxml"]
vba-inspection = ["dep:litchi-vba"]

[dependencies]
caseless = { workspace = true }
chrono = { workspace = true }
litchi-core = { workspace = true }
litchi-crypto = { workspace = true, optional = true }
litchi-opc = { workspace = true }
litchi-vba = { workspace = true, optional = true }
memchr = { workspace = true }
quick-xml = { workspace = true }
ryu = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
