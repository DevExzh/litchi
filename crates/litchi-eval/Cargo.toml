[package]
name        = "litchi-eval"
description = "Formula evaluator engine for Litchi spreadsheets."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = []
web_functions = ["dep:urlencoding", "dep:sxd-document", "dep:sxd-xpath"]

[dependencies]
chrono       = { workspace = true }
litchi-core  = { workspace = true }
num-complex  = { workspace = true }
once_cell    = { workspace = true }
parking_lot  = { workspace = true }
phf          = { workspace = true }
rand         = { workspace = true }
statrs       = { workspace = true }
sxd-document = { workspace = true, optional = true }
sxd-xpath    = { workspace = true, optional = true }
urlencoding  = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }

[lints]
workspace = true
