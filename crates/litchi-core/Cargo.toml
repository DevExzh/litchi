[package]
name        = "litchi-core"
description = "Common types, traits, and utilities for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# ODF detection remains pre-ADR extraction debt. Legacy text codecs no longer
# create binary-Office or RTF format features in this neutral crate.
default = []
odf = []

[dependencies]
aho-corasick    = { workspace = true }
chrono          = { workspace = true }
fast-float2     = { workspace = true }
once_cell       = { workspace = true }
quick-xml       = { workspace = true }
rand            = { workspace = true }
serde           = { workspace = true }
smallvec        = { workspace = true }
soapberry-zip   = { workspace = true }
thiserror       = { workspace = true }
zerocopy        = { workspace = true }
