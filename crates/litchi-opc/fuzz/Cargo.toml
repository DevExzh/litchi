[package]
name = "litchi-opc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
litchi-opc = { path = ".." }
soapberry-zip = { path = "../../soapberry-zip" }

[[bin]]
name = "parse_opc"
path = "fuzz_targets/parse_opc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smoke_opc"
path = "fuzz_targets/smoke_opc.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[workspace]
