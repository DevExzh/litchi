[package]
name        = "litchi-ooxml"
description = "Modern Office Open XML formats (.docx, .xlsx, .xlsb, .pptx) parser/writer for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = []
encryption = ["dep:litchi-crypto"]
fonts = ["dep:litchi-fonts", "dep:allsorts"]

[dependencies]
allsorts        = { workspace = true, optional = true }
atoi_simd       = { workspace = true }
base64          = { workspace = true }
bytes           = { workspace = true }
chrono          = { workspace = true }
encoding_rs     = { workspace = true }
fast-float2     = { workspace = true }
litchi-core     = { workspace = true }
litchi-crypto   = { workspace = true, features = ["ooxml"], optional = true }
litchi-docx      = { workspace = true }
litchi-drawingml = { workspace = true }
litchi-fonts    = { workspace = true, optional = true }
litchi-ooxml-common = { workspace = true }
litchi-opc      = { workspace = true }
litchi-pptx     = { workspace = true }
litchi-sign     = { workspace = true }
litchi-vba      = { workspace = true }
litchi-xlsb     = { workspace = true }
litchi-xlsx     = { workspace = true }
memchr          = { workspace = true }
quick-xml       = { workspace = true }
rand            = { workspace = true }
roaring         = { workspace = true }
ryu             = { workspace = true }
sha2            = { workspace = true, features = ["zeroize"] }
smallvec        = { workspace = true }
thiserror       = { workspace = true }
zeroize         = { workspace = true }

[dev-dependencies]
proptest = "1.5"
tempfile = { workspace = true }
