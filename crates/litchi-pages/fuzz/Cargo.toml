[package]
name = "litchi-pages-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
litchi-iwa-archive = { path = "../../litchi-iwa-archive" }
litchi-iwa-common = { path = "../../litchi-iwa-common" }
litchi-iwa-core = { path = "../../litchi-iwa-core" }
litchi-iwa-protos = { path = "../../litchi-iwa-protos" }
litchi-pages = { path = ".." }
prost = "0.14"

[[bin]]
name = "pages_body_drawable_order"
path = "fuzz_targets/pages_body_drawable_order.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[workspace]
