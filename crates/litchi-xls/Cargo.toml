[package]
name = "litchi-xls"
description = "Typed legacy Microsoft Excel BIFF reader and writer for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Converts OLE equations (MTEF) to and from LaTeX and OMML through
# `litchi-equation`, and draws their preview pictures with its renderer
# (`litchi-equation/render`, which embeds about 1.9 MB of fonts).
equation = ["dep:litchi-equation", "litchi-equation/render"]

[dependencies]
bitflags           = { workspace = true }
caseless           = { workspace = true }
chrono             = { workspace = true }
litchi-biff         = { workspace = true }
litchi-cfb         = { workspace = true }
litchi-codepage    = { workspace = true }
litchi-core        = { workspace = true }
litchi-crypto      = { workspace = true }
litchi-equation    = { workspace = true, optional = true }
litchi-odraw       = { workspace = true }
litchi-ograph      = { workspace = true }
litchi-ole-common = { workspace = true }
litchi-sign        = { workspace = true }
litchi-vba         = { workspace = true }
rand               = { workspace = true }
serde_json         = { workspace = true }
unicode-normalization = { workspace = true }
zeroize            = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
