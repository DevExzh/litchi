[package]
name = "litchi-py"
version = "0.0.1"
edition = "2024"

[lib]
name = "litchi_py"
crate-type = ["cdylib"]
doctest = false

[dependencies]

# The main litchi library. `legacy` is doc, ppt and xls; `iwork` turns on the
# unified Pages, Keynote and Numbers handles (record 0296).
litchi = { path = "../litchi", default-features = false, features = [
    "legacy",
    "ooxml",
    "odf",
    "iwork",
    "rtf",
    "formula",
    "images",
    "eval",
] }
# PyO3 for Python bindings
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
# Builds Python objects from Litchi's `Serialize` values (view JSON, the
# capability report, metadata) without writing JSON text.
serde = { workspace = true }
