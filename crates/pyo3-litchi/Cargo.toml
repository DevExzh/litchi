[package]
name = "litchi-py"
version = "0.0.1"
edition = "2024"

[lib]
name = "litchi_py"
crate-type = ["cdylib"]

[dependencies]

# The main litchi library. `legacy` is doc, ppt and xls; `iwork` keeps the
# facade's Pages, Keynote and Numbers readers, which `litchi::File` does not
# hold until tier 3.
litchi = { path = "../litchi", default-features = false, features = [
    "legacy",
    "ooxml",
    "odf",
    "iwork",
    "rtf",
    "formula",
    "images",
] }
# PyO3 for Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
# Builds Python objects from Litchi's `Serialize` values (view JSON, the
# capability report, metadata) without writing JSON text.
serde = { workspace = true }
