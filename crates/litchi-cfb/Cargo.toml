[package]
name        = "litchi-cfb"
description = "Microsoft Compound File Binary (CFB / OLE2) container parser and writer for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = []
# Writing/mutation support. Without this feature only reading is available.
write = []

[dependencies]
litchi-core     = { workspace = true }
rayon           = { workspace = true }
sha2            = { workspace = true }
smallvec        = { workspace = true }
zerocopy        = { workspace = true }
zerocopy-derive = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
