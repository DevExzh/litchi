[package]
name = "litchi-pptx"
description = "Strict, safe, and move-first PresentationML (.pptx) APIs for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
fonts = ["dep:litchi-fonts"]
font-subset = ["fonts", "litchi-fonts/subset"]
font-discovery = ["fonts", "litchi-fonts/discovery"]
automatic-fonts = ["font-subset", "font-discovery", "litchi-fonts/automatic"]
vba-inspection = ["litchi-ooxml-common/vba-inspection"]
encryption = ["dep:litchi-crypto", "litchi-ooxml-common/encryption"]
# Converts slide equations (OMML) to LaTeX through `litchi-equation`, and
# writes them (`opened::Edit::add_equation`, `set_equation`,
# `remove_equation`). Writing needs the PNG picture PowerPoint keeps beside
# every equation for readers without Office Math, so this feature also turns
# on the renderer (`litchi-equation/render`, which embeds about 1.9 MB of
# fonts). OLE equation objects (MathType, Equation Editor 3.0) are read and
# written through `litchi-equation/ole` (`Slide::ole_equations`,
# `opened::Edit::add_ole_equation`, `set_ole_equation`,
# `remove_ole_equation`).
equation = [
  "dep:litchi-equation",
  "litchi-equation/render",
  "litchi-equation/ole",
  "litchi-drawingml/equation",
]

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true }
caseless = { workspace = true }
chrono = { workspace = true }
litchi-core = { workspace = true }
litchi-crypto = { workspace = true, optional = true, features = ["ooxml"] }
litchi-drawingml = { workspace = true }
litchi-equation = { workspace = true, optional = true }
litchi-fonts = { workspace = true, optional = true }
litchi-ooxml-common = { workspace = true }
litchi-opc = { workspace = true }
memchr = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true, features = ["zeroize"] }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
soapberry-zip = { workspace = true }
tempfile = { workspace = true }
tiny-skia = { workspace = true }

[lints]
workspace = true
