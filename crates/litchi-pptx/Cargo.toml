[package]
name = "litchi-pptx"
description = "Strict, safe, and move-first PresentationML (.pptx) APIs for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
fonts = ["dep:litchi-fonts"]
font-subset = ["fonts", "litchi-fonts/subset"]
font-discovery = ["fonts", "litchi-fonts/discovery"]
automatic-fonts = ["font-subset", "font-discovery", "litchi-fonts/automatic"]
vba-inspection = ["litchi-ooxml-common/vba-inspection"]
encryption = [
    "dep:litchi-crypto",
    "litchi-ooxml-common/encryption",
]

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true }
caseless = { workspace = true }
chrono = { workspace = true }
litchi-drawingml = { workspace = true }
litchi-crypto = { workspace = true, optional = true, features = ["ooxml"] }
litchi-fonts = { workspace = true, optional = true }
litchi-ooxml-common = { workspace = true }
litchi-opc = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true, features = ["zeroize"] }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
memchr = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
