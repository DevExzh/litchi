[package]
name        = "litchi-ole"
description = "Legacy OLE2 binary office formats (.doc, .xls, .ppt) parser/writer for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = []
formula = ["dep:litchi-formula"]
imgconv = ["dep:litchi-imgconv"]

[dependencies]
bitflags        = { workspace = true }
bumpalo         = { workspace = true }
bytes           = { workspace = true }
chrono          = { workspace = true }
encoding_rs     = { workspace = true }
flate2          = { workspace = true }
litchi-cfb      = { workspace = true }
litchi-core     = { workspace = true, features = ["ole"] }
litchi-formula  = { workspace = true, optional = true }
litchi-imgconv  = { workspace = true, optional = true }
litchi-odraw    = { workspace = true }
litchi-ole-common = { workspace = true }
litchi-opc      = { workspace = true }
md-5            = { workspace = true }
once_cell       = { workspace = true }
quick-xml       = { workspace = true }
rand            = { workspace = true }
rc4             = { workspace = true }
sha1            = { workspace = true }
smallvec        = { workspace = true }
subtle          = { workspace = true }
thiserror       = { workspace = true }
url             = { workspace = true }
zerocopy        = { workspace = true }
zerocopy-derive = { workspace = true }
zeroize         = { workspace = true }

[dev-dependencies]
p256            = { workspace = true }
rsa             = { workspace = true }
