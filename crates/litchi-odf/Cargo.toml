[package]
name        = "litchi-odf"
description = "OpenDocument Format (ODF) parser for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
aes           = { workspace = true }
aes-gcm       = { workspace = true }
argon2        = { workspace = true }
atoi_simd     = { workspace = true }
base64        = { workspace = true }
bergshamra-c14n = { workspace = true }
blowfish      = { workspace = true }
cbc           = { workspace = true }
chrono        = { workspace = true }
fast-float2   = { workspace = true }
flate2        = { workspace = true }
hmac          = { workspace = true }
litchi-core   = { workspace = true }
litchi-odf-common = { workspace = true }
memchr        = { workspace = true }
p256          = { workspace = true }
pbkdf2        = { workspace = true }
phf           = { workspace = true }
quick-xml     = { workspace = true }
rand          = { workspace = true }
rsa           = { workspace = true }
sha1          = { workspace = true }
sha2          = { workspace = true }
signature     = { workspace = true }
smallvec      = { workspace = true }
soapberry-zip = { workspace = true }
subtle        = { workspace = true }
x509-cert     = { workspace = true }
xml-minifier  = { workspace = true }
zeroize       = { workspace = true }

[dev-dependencies]
litchi-eval = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
zip      = { version = "8", default-features = false, features = ["deflate"] }
