[package]
name        = "litchi-odf"
description = "OpenDocument Format (ODF) parser for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
atoi_simd     = { workspace = true }
base64        = { workspace = true }
chrono        = { workspace = true }
fast-float2   = { workspace = true }
litchi-core   = { workspace = true, features = ["odf"] }
memchr        = { workspace = true }
phf           = { workspace = true }
quick-xml     = { workspace = true }
smallvec      = { workspace = true }
soapberry-zip = { workspace = true }
xml-minifier  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zip      = { version = "8", default-features = false, features = ["deflate"] }
