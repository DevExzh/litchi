[package]
name        = "litchi-odf"
description = "OpenDocument Format (ODF) parser for the Litchi office-formats library."
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
litchi-odf-common = { workspace = true }
litchi-odp = { workspace = true }
litchi-ods = { workspace = true }
litchi-odt = { workspace = true }

[dev-dependencies]
litchi-eval = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
zip      = { version = "8", default-features = false, features = ["deflate"] }
