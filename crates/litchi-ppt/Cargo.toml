[package]
name = "litchi-ppt"
description = "Typed legacy Microsoft PowerPoint reader and writer for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Runtime-neutral phase callbacks for reproducible native commit attribution.
performance-diagnostics = []
sign = ["dep:litchi-sign", "litchi-opc/sign"]
encryption = ["dep:litchi-crypto", "dep:rand"]
vba-inspection = ["dep:litchi-vba"]
fonts = ["dep:litchi-fonts"]
font-subset = ["fonts", "litchi-fonts/subset"]
font-discovery = ["fonts", "litchi-fonts/discovery"]
automatic-fonts = ["font-subset", "font-discovery", "litchi-fonts/automatic"]
# Reads slide equations as LaTeX and writes them (`Package::edit_equations`)
# through `litchi-equation`. Writing renders the PNG preview PowerPoint
# shows for every equation object, so this feature also turns on the
# renderer (`litchi-equation/render`, which embeds about 1.9 MB of fonts).
equation = ["dep:litchi-equation", "litchi-equation/render"]

[dependencies]
bitflags           = { workspace = true }
chrono             = { workspace = true }
flate2             = { workspace = true }
litchi-cfb         = { workspace = true }
litchi-codepage    = { workspace = true }
litchi-core        = { workspace = true }
litchi-crypto      = { workspace = true, optional = true }
litchi-equation    = { workspace = true, optional = true }
litchi-fonts       = { workspace = true, optional = true }
litchi-odraw       = { workspace = true }
litchi-ograph      = { workspace = true }
litchi-ole-common  = { workspace = true }
litchi-opc         = { workspace = true }
litchi-sign        = { workspace = true, optional = true }
litchi-vba         = { workspace = true, optional = true }
once_cell          = { workspace = true }
quick-xml          = { workspace = true }
rand               = { workspace = true, optional = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
siphasher          = { workspace = true }
url                = { workspace = true }
zerocopy           = { workspace = true }
zerocopy-derive    = { workspace = true }
zeroize            = { workspace = true }

[dev-dependencies]
sha1 = { workspace = true }
soapberry-zip = { workspace = true }

[lints]
workspace = true
