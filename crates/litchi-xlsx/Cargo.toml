[package]
name = "litchi-xlsx"
description = "Typed, lossless Excel Open XML documents for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
encryption = [
    "dep:litchi-crypto",
    "litchi-crypto/ooxml",
    "litchi-ooxml-common/encryption",
]
vba-inspection = ["dep:litchi-vba", "litchi-ooxml-common/vba-inspection"]

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true }
caseless = { workspace = true }
chrono = { workspace = true }
litchi-core = { workspace = true }
litchi-crypto = { workspace = true, optional = true }
litchi-drawingml = { workspace = true }
litchi-ooxml-common = { workspace = true }
litchi-opc = { workspace = true }
litchi-sheet = { workspace = true }
litchi-spreadsheet-drawing = { workspace = true }
litchi-vba = { workspace = true, optional = true }
memchr = { workspace = true }
once_cell = { workspace = true }
quick-xml = { workspace = true }
ryu = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
