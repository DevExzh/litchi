[package]
name = "soapberry-zip"
version = "0.0.1"
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
edition = "2021"
description = "High-performance ZIP reader for Office document formats (OOXML, ODF, iWork)"
license = "MIT"
keywords = ["zip", "archive", "office"]
categories = ["filesystem", "compression", "parser-implementations"]
rust-version.workspace = true

[dependencies]
# Hardware-accelerated CRC32 (uses SIMD/PCLMULQDQ when available)
crc32fast = "1.5.4"
# Keep runtime CPU dispatch enabled with the Rust-only Deflate backend.
flate2 = { workspace = true }
# Parallel processing for multi-threaded decompression
rayon = "1.12.0"
# SHA-256 replay fingerprints.
sha2 = { workspace = true }

[dev-dependencies]
jiff = "0.2.40"
paste = "1.0.15"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rstest = "0.28.0"
tempfile = "3.27.0"
