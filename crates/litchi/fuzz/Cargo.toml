[package]
name = "litchi-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[[bin]]
name = "parse_iwork"
path = "fuzz_targets/parse_iwork.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keynote_slide_text"
path = "fuzz_targets/keynote_slide_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keynote_show_settings"
path = "fuzz_targets/keynote_show_settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keynote_slide_transition"
path = "fuzz_targets/keynote_slide_transition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers_table_lock"
path = "fuzz_targets/numbers_table_lock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers_table_headers"
path = "fuzz_targets/numbers_table_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers_names"
path = "fuzz_targets/numbers_names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers_formula_cells"
path = "fuzz_targets/numbers_formula_cells.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pages_page_layout"
path = "fuzz_targets/pages_page_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pages_document_settings"
path = "fuzz_targets/pages_document_settings.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
litchi = { path = "..", default-features = false, features = ["iwork"] }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
