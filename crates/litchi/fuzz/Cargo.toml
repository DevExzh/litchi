[package]
name = "litchi-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
litchi = { path = "..", default-features = false, features = ["iwork"] }

[[bin]]
name = "parse_iwork"
path = "fuzz_targets/parse_iwork.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keynote_slide_text"
path = "fuzz_targets/keynote_slide_text.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[workspace]
