[package]
name = "litchi"
version = "0.0.1"
edition = "2024"
description = "High-performance parser for Microsoft Office, OpenDocument, and Apple iWork file formats with unified API"
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/DevExzh/litchi"
documentation = "https://docs.rs/litchi"
readme = "../../README.md"
keywords = ["office", "docx", "xlsx", "pptx", "parser"]
categories = ["parser-implementations", "encoding", "text-processing"]
exclude = [
    # Reference materials and third-party projects
    "3rdparty/*",
    # Examples
    "examples/*",
    # Test files
    "test.*",
    "*.doc",
    "*.docx",
    "*.xls",
    "*.xlsx",
    "*.xlsb",
    "*.ppt",
    "*.pptx",
    "*.odt",
    "*.ods",
    "*.odp",
    "*.pages",
    "*.numbers",
    "*.key",
    "*.csv",
    "*.txt",
    # Build artifacts
    "target/*",
    # Media files (logo kept for crates.io display)
    # "media/*",  # Uncomment if logo shouldn't be in package
    # CI/CD and development files
    ".github/*",
    ".git/*",
    ".gitignore",
]

[features]
default = []

# Format leaves
doc = ["dep:litchi-doc", "cfb", "ole"]
docx = ["dep:litchi-docx", "opc"]
ppt = ["dep:litchi-ppt", "cfb", "ole"]
pptx = ["dep:litchi-pptx", "opc", "ooxml-common", "drawingml"]
xls = ["dep:litchi-xls", "cfb", "ole", "sheet"]
xlsx = ["dep:litchi-xlsx", "opc", "ooxml-common", "drawingml", "sheet"]
xlsb = ["dep:litchi-xlsb", "opc", "ooxml-common", "sheet"]
rtf = ["dep:litchi-rtf", "dep:chrono"]
odt = ["dep:litchi-odt", "odf-common"]
ods = ["dep:litchi-ods", "odf-common", "sheet"]
odp = ["dep:litchi-odp", "odf-common"]
pages = ["dep:litchi-pages", "dep:litchi-iwa-detect"]
keynote = ["dep:litchi-keynote", "dep:litchi-iwa-detect"]
numbers = ["dep:litchi-numbers", "dep:litchi-iwa-detect", "sheet"]
iwork = ["pages", "keynote", "numbers"]

# Low-level and opt-in capabilities
cfb = ["dep:litchi-cfb"]
ole = ["dep:litchi-ole-common"]
opc = ["dep:litchi-opc"]
ooxml-common = ["dep:litchi-ooxml-common"]
drawingml = ["dep:litchi-drawingml"]
odf-common = ["dep:litchi-odf-common"]
sheet = ["dep:litchi-sheet", "dep:fast-float2"]
sign = [
    "dep:litchi-sign",
    "litchi-opc?/sign",
    "litchi-docx?/sign",
    "litchi-ppt?/sign",
    "litchi-xlsb?/sign",
]
encryption = ["dep:litchi-crypto", "litchi-docx?/encryption", "litchi-ppt?/encryption"]
vba-inspection = [
    "litchi-docx?/vba-inspection",
    "litchi-ooxml-common?/vba-inspection",
    "litchi-ppt?/vba-inspection",
    "litchi-pptx?/vba-inspection",
    "litchi-xlsb?/vba-inspection",
    "litchi-xlsx?/vba-inspection",
]
formula = ["dep:litchi-formula", "litchi-doc?/formula", "litchi-ppt?/formula"]
fonts = ["dep:litchi-fonts", "litchi-docx?/fonts", "litchi-ppt?/fonts", "litchi-pptx?/fonts"]
font-subset = [
    "fonts",
    "litchi-fonts/subset",
    "litchi-docx?/font-subset",
    "litchi-ppt?/font-subset",
    "litchi-pptx?/font-subset",
]
font-discovery = [
    "fonts",
    "litchi-fonts/discovery",
    "litchi-docx?/font-discovery",
    "litchi-ppt?/font-discovery",
    "litchi-pptx?/font-discovery",
]
automatic-fonts = [
    "font-subset",
    "font-discovery",
    "litchi-fonts/automatic",
    "litchi-docx?/automatic-fonts",
    "litchi-ppt?/automatic-fonts",
    "litchi-pptx?/automatic-fonts",
]
images = ["dep:litchi-imgconv", "dep:litchi-odraw"]
eval = ["dep:litchi-eval"]
web-functions = ["eval", "litchi-eval/web_functions"]
markdown = ["dep:litchi-markdown", "dep:memchr", "dep:rayon"]
yaml = ["dep:serde-saphyr"]

# Format and convenience aggregates
legacy = ["doc", "ppt", "xls", "cfb", "ole"]
ooxml = ["docx", "pptx", "xlsx", "xlsb", "opc", "ooxml-common", "drawingml"]
odf = ["odt", "ods", "odp", "odf-common"]
word = ["doc", "docx", "rtf", "odt", "pages"]
slides = ["ppt", "pptx", "odp", "keynote"]
spreadsheets = ["xls", "xlsx", "xlsb", "ods", "numbers", "sheet"]
office = ["legacy", "ooxml", "odf", "rtf", "iwork"]
all-formats = ["office"]
all = [
    "all-formats",
    "cfb",
    "ole",
    "opc",
    "ooxml-common",
    "drawingml",
    "odf-common",
    "sheet",
    "sign",
    "encryption",
    "vba-inspection",
    "formula",
    "automatic-fonts",
    "images",
    "eval",
    "web-functions",
    "markdown",
    "yaml",
]

[dependencies]
chrono = { version = "0", features = ["serde"], optional = true } # RTF metadata timestamps
fast-float2 = { version = "0.2", optional = true } # Text-sheet numeric parsing
litchi-cfb = { workspace = true, optional = true } # Compound File Binary substrate
litchi-core = { workspace = true } # Common types, traits, and utilities
litchi-crypto = { workspace = true, features = ["ooxml"], optional = true } # Office encryption support
litchi-doc = { workspace = true, optional = true } # Legacy Word binary support
litchi-docx = { workspace = true, optional = true } # WordprocessingML support
litchi-drawingml = { workspace = true, optional = true } # Shared DrawingML vocabulary
litchi-eval = { workspace = true, optional = true } # Formula evaluation
litchi-fonts = { workspace = true, optional = true } # Font support
litchi-formula = { workspace = true, optional = true } # Formula parsing and conversion
litchi-imgconv = { workspace = true, optional = true } # Legacy image conversion
litchi-iwa-detect = { workspace = true, optional = true } # Bounded iWork package detection
litchi-keynote = { workspace = true, optional = true } # Apple Keynote support
litchi-markdown = { workspace = true, optional = true } # Markdown emission
litchi-numbers = { workspace = true, optional = true } # Apple Numbers support
litchi-odf-common = { workspace = true, optional = true } # Shared OpenDocument vocabulary
litchi-odp = { workspace = true, optional = true } # OpenDocument Presentation support
litchi-ods = { workspace = true, optional = true } # OpenDocument Spreadsheet support
litchi-odt = { workspace = true, optional = true } # OpenDocument Text support
litchi-odraw = { workspace = true, optional = true } # OfficeArt image grammar
litchi-ole-common = { workspace = true, optional = true } # Shared OLE2 vocabulary
litchi-ooxml-common = { workspace = true, optional = true } # Shared OOXML vocabulary
litchi-opc = { workspace = true, optional = true } # Open Packaging Conventions support
litchi-ppt = { workspace = true, optional = true } # Legacy PowerPoint binary support
litchi-pptx = { workspace = true, optional = true } # PresentationML support
litchi-pages = { workspace = true, optional = true } # Apple Pages support
litchi-rtf = { workspace = true, optional = true } # Rich Text Format support
litchi-sheet = { workspace = true, optional = true } # Shared spreadsheet vocabulary
litchi-sign = { workspace = true, optional = true } # Office signature support
litchi-xls = { workspace = true, optional = true } # Legacy Excel BIFF support
litchi-xlsb = { workspace = true, optional = true } # BIFF12 support
litchi-xlsx = { workspace = true, optional = true } # SpreadsheetML support
memchr = { version = "2.7", optional = true } # Markdown escaping
rayon = { version = "1.11", optional = true } # Parallel Markdown rendering
serde-saphyr = { version = "0", optional = true } # YAML metadata serialization

[build-dependencies]
# (none) — iwa proto compilation lives in `crates/litchi-iwa-protos/build.rs`.

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

