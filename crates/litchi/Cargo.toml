[package]
name = "litchi"
version = "0.0.1"
edition = "2024"
description = "High-performance parser for Microsoft Office, OpenDocument, and Apple iWork file formats with unified API"
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/DevExzh/litchi"
documentation = "https://docs.rs/litchi"
readme = "../../README.md"
keywords = ["office", "docx", "xlsx", "pptx", "parser"]
categories = ["parser-implementations", "encoding", "text-processing"]
exclude = [
    # Reference materials and third-party projects
    "3rdparty/*",
    # Examples
    "examples/*",
    # Test files
    "test.*",
    "*.doc",
    "*.docx",
    "*.xls",
    "*.xlsx",
    "*.xlsb",
    "*.ppt",
    "*.pptx",
    "*.odt",
    "*.ods",
    "*.odp",
    "*.pages",
    "*.numbers",
    "*.key",
    "*.csv",
    "*.txt",
    # Build artifacts
    "target/*",
    # Media files (logo kept for crates.io display)
    # "media/*",  # Uncomment if logo shouldn't be in package
    # CI/CD and development files
    ".github/*",
    ".git/*",
    ".gitignore",
]

[features]
default = ["doc", "ppt", "xls", "ooxml", "ooxml_encryption", "eval_engine"]
full = [
    "iwa",
    "odf",
    "doc",
    "ppt",
    "xls",
    "ooxml",
    "ooxml_encryption",
    "rtf",
    "formula",
    "imgconv",
    "eval_engine",
    "fonts",
    "sign",
]
# Format support features
iwa = ["dep:litchi-iwa"]
odf = [
    "dep:litchi-odf-common",
    "dep:litchi-odp",
    "dep:litchi-ods",
    "dep:litchi-odt",
]
doc = ["dep:litchi-cfb", "dep:litchi-doc", "sign"]
ppt = ["dep:litchi-cfb", "dep:litchi-ppt", "sign"]
xls = ["dep:litchi-cfb", "dep:litchi-xls", "sign"]
ooxml = [
    "dep:litchi-docx",
    "dep:litchi-drawingml",
    "dep:litchi-ooxml-common",
    "dep:litchi-opc",
    "dep:litchi-pptx",
    "dep:litchi-xlsb",
    "dep:litchi-xlsx",
    "sign",
]
ooxml_encryption = ["ooxml", "dep:litchi-crypto", "litchi-docx/encryption"]
rtf = ["dep:litchi-rtf"]
# Additional functionality features
formula = ["dep:litchi-formula", "litchi-doc?/formula", "litchi-ppt?/formula"]
imgconv = ["dep:litchi-imgconv", "dep:litchi-odraw"]
fonts = ["dep:allsorts", "dep:litchi-fonts", "litchi-docx?/fonts"]
sign = ["dep:litchi-sign"]
eval_engine = ["dep:litchi-eval"]
# Formula I/O is caller-injected through litchi-eval::Fetch; no runtime is selected here.
eval_engine_web_functions = ["eval_engine", "litchi-eval/web_functions"]

[dependencies]
aho-corasick = "1.1" # Fast string searching for fast byte pattern matching
allsorts = { version = "0.17", optional = true } # Font subsetting and layout
atoi_simd = "0.18" # SIMD-optimized conversion of byte slices to integers
base64 = "0.22" # Base64 encoding/decoding for embedded binary data in XML
bitflags = { version = "2.10", features = ["std", "serde"] } # Bit flags for efficient flag combinations
bytes = { version = "1", features = ["serde"] } # Efficient byte buffer operations with zero-copy slicing
chrono = { version = "0", features = ["serde"] } # Date and time types for Office timestamps
fast-float2 = "0.2" # Fast string-to-float conversion with correct rounding
fixedbitset = "0.5" # Fixed-size bitset for efficient visited tracking with better cache locality
flate2 = { version = "1", features = ["zlib-rs"], default-features = false } # Compression/decompression for Office file formats
itoa = "1.0" # Fast integer-to-string conversion
litchi-cfb = { workspace = true, optional = true } # Compound File Binary substrate shared by independently gated legacy formats
litchi-core = { workspace = true } # Common types, traits, and utilities (carved out in workspace split)
litchi-crypto = { workspace = true, features = ["ooxml"], optional = true } # Canonical runtime-neutral Office cryptography, gated by `ooxml_encryption`
litchi-doc = { workspace = true, optional = true } # Legacy Word binary parser/writer (.doc), independently gated by `doc`
litchi-docx = { workspace = true, optional = true } # Standalone WordprocessingML package and semantic APIs, gated by `ooxml`
litchi-drawingml = { workspace = true, optional = true } # Shared DrawingML chart and diagram vocabulary, gated by `ooxml`
litchi-eval = { workspace = true, optional = true } # Formula evaluator engine (carved out in workspace split, gated by `eval_engine` feature)
litchi-fonts = { workspace = true, optional = true } # Font discovery, loading, and subsetting (carved out in workspace split, gated by `fonts` feature)
litchi-formula = { workspace = true, optional = true } # Formula parser/converter (carved out in workspace split, gated by `formula` feature)
litchi-imgconv = { workspace = true, optional = true } # EMF/WMF/PICT image conversion (carved out in workspace split, gated by `imgconv` feature)
litchi-iwa = { workspace = true, optional = true } # Apple iWork (.pages, .numbers, .key) parser (carved out in workspace split, gated by `iwa` feature)
litchi-markdown = { workspace = true } # Format-agnostic Markdown emission helpers (carved out in workspace split)
litchi-odf-common = { workspace = true, optional = true } # Format-neutral OpenDocument vocabulary and detection
litchi-odp = { workspace = true, optional = true } # OpenDocument Presentation (.odp) parser, gated by `odf`
litchi-ods = { workspace = true, optional = true } # OpenDocument Spreadsheet (.ods) parser, gated by `odf`
litchi-odt = { workspace = true, optional = true } # OpenDocument Text (.odt) parser, gated by `odf`
litchi-odraw = { workspace = true, optional = true } # Host-neutral OfficeArt image grammar exposed by the image facade
litchi-ooxml-common = { workspace = true, optional = true } # Host-neutral OOXML package grammar exposed directly by the OOXML facade
litchi-opc = { workspace = true, optional = true } # Open Packaging Conventions package graph used by standalone OOXML families
litchi-ppt = { workspace = true, optional = true } # Legacy PowerPoint binary parser/writer (.ppt), independently gated by `ppt`
litchi-pptx = { workspace = true, optional = true } # Canonical PresentationML capabilities, gated by `ooxml`
litchi-rtf = { workspace = true, optional = true } # RTF parser and writer (carved out in workspace split, gated by `rtf` feature)
litchi-sign = { workspace = true, optional = true } # Trust-neutral Office signature authoring and verification
litchi-xls = { workspace = true, optional = true } # Legacy Excel BIFF parser/writer, independently gated by `xls`
litchi-xlsb = { workspace = true, optional = true } # Canonical BIFF12 record capabilities, gated by `ooxml`
litchi-xlsx = { workspace = true, optional = true } # Standalone SpreadsheetML package and semantic APIs, gated by `ooxml`
memchr = "2.7" # SIMD-accelerated string searching for fast byte pattern matching
once_cell = "1" # Lazy statics and one-time initialization for global state
parking_lot = { version = "0.12", features = ["hardware-lock-elision"] } # Lock-free synchronization primitives for concurrent programming
phf = { version = "0.14", features = ["macros"] } # Perfect hash functions for compile-time static maps
rand = "0.10" # Cryptographically secure random numbers for salts in protection hashes
rayon = "1.11" # Data parallelism library for parallel iterators and work-stealing
roaring = "0" # Compressed bitmap data structure for efficient set operations
ryu = "1.0" # Fast float-to-string conversion with minimal allocations
serde = { version = "1", features = ["derive"] } # Serialization/deserialization framework
serde-saphyr = "0" # YAML serialization support
sha2 = "0.11" # SHA-512 hashing for OOXML password protection
smallvec = "1.15" # Stack-allocated vectors for small collections to avoid heap allocations
thiserror = "2.0" # Convenient derive macros for error types
zerocopy = { version = "0.8", features = ["std"] } # Safe zero-cost type conversions between bytes and structured data
zerocopy-derive = "0.8" # Derive macros for zerocopy traits

[build-dependencies]
# (none) — iwa proto compilation lives in `crates/litchi-iwa/build.rs`.

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

