[package]
name = "litchi-docx"
description = "Strict, safe, and move-first WordprocessingML (.docx) APIs for Litchi."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
encryption = ["dep:litchi-crypto"]
# Format-independent font models, caller-supplied resolution, and glyph collection.
fonts = ["dep:litchi-fonts"]
# OpenType glyph subsetting without native system-font discovery.
font-subset = ["fonts", "litchi-fonts/subset"]
# Native system-font discovery without OpenType subsetting.
font-discovery = ["fonts", "litchi-fonts/discovery"]
# The existing save-time system-resolution and subsetting workflow.
automatic-fonts = ["font-subset", "font-discovery", "litchi-fonts/automatic"]
sign = ["dep:litchi-sign", "litchi-opc/sign"]
vba-inspection = ["dep:litchi-vba", "litchi-ooxml-common/vba-inspection"]

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true }
caseless = { workspace = true }
atoi_simd = { workspace = true }
chrono = { workspace = true }
litchi-core = { workspace = true }
litchi-drawingml = { workspace = true }
litchi-sign = { workspace = true, optional = true }
litchi-ooxml-common = { workspace = true }
litchi-opc = { workspace = true }
litchi-vba = { workspace = true, optional = true }
quick-xml = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

[dependencies.litchi-crypto]
workspace = true
features = ["ooxml"]
optional = true

[dependencies.litchi-fonts]
workspace = true
optional = true

[dev-dependencies]
tempfile = { workspace = true }

[[example]]
name = "write_encrypted_docx"
required-features = ["encryption"]

[lints]
workspace = true
