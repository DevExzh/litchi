[package]
name = "litchi-iwa-protos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
litchi-iwa-protos = { path = ".." }
prost = "0.14"

[[bin]]
name = "numbers_tile_storage"
path = "fuzz_targets/numbers_tile_storage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers_table_data_list"
path = "fuzz_targets/numbers_table_data_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "comment_storage_codec"
path = "fuzz_targets/comment_storage_codec.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[workspace]
