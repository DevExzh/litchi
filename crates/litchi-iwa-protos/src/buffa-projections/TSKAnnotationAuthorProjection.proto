// Wire-only Buffa parity projection for TSK annotation authors and their
// package-owned author storage.  The complete TSK archives remain outside
// this closure; the handwritten codec keeps caller-owned bytes authoritative
// for preservation and source-order rewrites.
syntax = "proto2";

package LitchiIwaAnnotationAuthorProjection;

message Color {
  required int32 model = 1;
  optional float r = 3;
  optional float g = 4;
  optional float b = 5;
  optional float a = 6;
  optional float c = 7;
  optional float m = 8;
  optional float y = 9;
  optional float k = 10;
  optional float w = 11;
  optional int32 rgbspace = 12;
}

message Reference {
  required uint64 identifier = 1;
  optional int32 deprecated_type = 2;
  optional bool deprecated_is_external = 3;
}

message AnnotationAuthorArchive {
  optional string name = 1;
  optional .LitchiIwaAnnotationAuthorProjection.Color color = 2;
  optional string public_id = 3;
  optional bool is_public_author = 4;
  repeated string public_ids = 5;
}

message AnnotationAuthorStorageArchive {
  repeated .LitchiIwaAnnotationAuthorProjection.Reference annotation_author = 1;
}
