// Private, write-only Buffa projection for a fresh Keynote rectangle text box.
//
// This is a deliberately narrow closure of TSD.ShapeInfoArchive and
// TSWP.StorageArchive.  It carries only the canonical fields required for a
// source-free text-box graph; source graphs remain byte-authoritative when
// they are cloned or edited.
syntax = "proto2";
package LitchiIwaProjection;

message Reference {
  required uint64 identifier = 1;
}

message Point {
  required float x = 1;
  required float y = 2;
}

message Size {
  required float width = 1;
  required float height = 2;
}

message GeometryArchive {
  optional .LitchiIwaProjection.Point position = 1;
  optional .LitchiIwaProjection.Size size = 2;
  optional uint32 flags = 3;
  optional float angle = 4;
}

message ExteriorTextWrapArchive {
  optional uint32 type = 1;
  optional uint32 direction = 2;
  optional uint32 fit_type = 3;
  optional float margin = 4;
  optional float alpha_threshold = 5;
  optional bool is_html_wrap = 6;
}

message DrawableArchive {
  optional .LitchiIwaProjection.GeometryArchive geometry = 1;
  optional .LitchiIwaProjection.Reference parent = 2;
  optional .LitchiIwaProjection.ExteriorTextWrapArchive exterior_text_wrap = 3;
  optional bool locked = 5;
  optional bool aspect_ratio_locked = 7;
  optional .LitchiIwaProjection.Reference title = 10;
  optional .LitchiIwaProjection.Reference caption = 11;
  optional bool title_hidden = 12;
  optional bool caption_hidden = 13;
}

message PathElement {
  required int32 type = 1;
  repeated .LitchiIwaProjection.Point points = 2;
}

message Path {
  repeated .LitchiIwaProjection.PathElement elements = 1;
}

message BezierPathSourceArchive {
  optional .LitchiIwaProjection.Size natural_size = 2;
  optional .LitchiIwaProjection.Path path = 3;
}

message PathSourceArchive {
  optional bool horizontal_flip = 1;
  optional bool vertical_flip = 2;
  optional .LitchiIwaProjection.BezierPathSourceArchive bezier_path_source = 5;
}

message ShapeArchive {
  required .LitchiIwaProjection.DrawableArchive super = 1;
  optional .LitchiIwaProjection.Reference style = 2;
  optional .LitchiIwaProjection.PathSourceArchive pathsource = 3;
  optional float stroke_pattern_offset_distance = 6;
}

message ShapeInfoArchive {
  required .LitchiIwaProjection.ShapeArchive super = 1;
  optional .LitchiIwaProjection.Reference deprecated_storage = 2;
  optional .LitchiIwaProjection.Reference text_flow = 3;
  optional .LitchiIwaProjection.Reference owned_storage = 4;
  optional bool is_text_box = 6;
}

message StorageArchive {
  optional int32 kind = 1;
  optional .LitchiIwaProjection.Reference style_sheet = 2;
  repeated string text = 3;
  optional bool in_document = 10;
}
