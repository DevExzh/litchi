// Wire-only Buffa projection derived from these canonical IWA declarations:
//
// - `TNArchives.proto`: `TN.SheetArchive.name`, field 1, and the required
//   `TN.FormBasedSheetArchive.super` inheritance envelope, field 1;
// - `TSTArchives.proto`: `TST.TableModelArchive.table_id`, field 1, and
//   `table_name`, field 8.
//
// Form sheets expose names through the required sheet envelope. This view
// omits sheet drawables and table metadata beyond the two required names.
// Pivot owners are write dependencies, not routed name sources. Caller-owned
// IWA bytes remain authoritative.
syntax = "proto2";

package LitchiIwaProjection;

message NumbersSheetArchive {
  required string name = 1;
}

message NumbersFormBasedSheetArchive {
  required .LitchiIwaProjection.NumbersSheetArchive super = 1;
}

message NumbersTableModelArchive {
  required string table_id = 1;
  required string table_name = 8;
}
