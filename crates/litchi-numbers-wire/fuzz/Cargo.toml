[package]
name = "litchi-numbers-wire-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Ryker Zhu <ryker.zhu@outlook.com>"]
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
litchi-numbers-wire = { path = ".." }

[[bin]]
name = "pre_bnc_cell"
path = "fuzz_targets/pre_bnc_cell.rs"
