# Quality limits for `cargo lint` (the workspace Clippy alias in
# `.cargo/config.toml`). They are hard ceilings for the existing parsers and
# format converters; lower them as those modules are decomposed.

# Reject exceptionally long functions.
too-many-lines-threshold = 2_000

# Require complicated control flow to be decomposed before it becomes opaque.
cognitive-complexity-threshold = 100
excessive-nesting-threshold = 10

# Prefer parameter objects and type aliases once APIs become unwieldy.
too-many-arguments-threshold = 12
type-complexity-threshold = 500

source-item-ordering = ["module", "trait"]

# quick-xml's own duplicate-attribute check pre-filters a tag's names with an
# unkeyed hash from its 33rd name on and rescans every earlier name on each
# hit, so its worst case grows with the square of the tag. Crates that read
# untrusted OOXML or OLE2 XML deny these methods outside their tests
# (`#![cfg_attr(not(test), deny(clippy::disallowed_methods))]`) and iterate
# through `BytesStartExt` instead (record 0770); the workspace allows the lint
# everywhere else.
disallowed-methods = [
  { path = "quick_xml::events::BytesStart::attributes", reason = "quick-xml's duplicate check is quadratic on hostile tags: use `BytesStartExt::checked_attributes` (stops at the first error), `first_wins` (reads past errors) or `BytesStartExt::unchecked_attributes` (record 0770)" },
  { path = "quick_xml::events::BytesStart::html_attributes", reason = "quick-xml's duplicate check is quadratic on hostile tags (record 0770)" },
  { path = "quick_xml::events::BytesPI::attributes", reason = "quick-xml's duplicate check is quadratic on hostile tags (record 0770)" },
  { path = "quick_xml::events::attributes::Attributes::new", reason = "quick-xml's duplicate check is quadratic on hostile tags (record 0770)" },
  { path = "quick_xml::events::attributes::Attributes::html", reason = "quick-xml's duplicate check is quadratic on hostile tags (record 0770)" },
  { path = "quick_xml::events::attributes::Attributes::with_checks", reason = "turning quick-xml's duplicate check on brings back its quadratic worst case; use `BytesStartExt` (record 0770)" },
]
