[package]
name = "litchi-docx-styles-effects-profile"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[[bin]]
name = "docx-styles-effects-profile"
path = "main.rs"

[dependencies]
litchi-docx = { path = "../../../../../crates/litchi-docx" }
litchi-opc = { path = "../../../../../crates/litchi-opc" }
