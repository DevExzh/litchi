[package]
name = "compression-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "compression-probe"
path = "src/main.rs"

[[bin]]
name = "codec-qualify"
path = "codec_main.rs"

[dependencies]
litchi-opc = { path = "../../../../../crates/litchi-opc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
soapberry-zip = { path = "../../../../../crates/soapberry-zip" }

# This is an independent evidence project.  Its manifest is passed to Cargo
# explicitly so it cannot accidentally inherit the root workspace feature
# unification.  In particular, it does not name flate2 directly: the probe
# exercises the exact litchi-opc -> soapberry-zip dependency path selected by
# the root lockfile.
[workspace]

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 1
panic = "unwind"
