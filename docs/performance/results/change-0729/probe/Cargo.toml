[package]
name = "ole-format-save-probe-0729"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "doc_phase_probe"
path = "src/main.rs"

[dependencies]
litchi-cfb = { path = "../../../../../crates/litchi-cfb" }
litchi-core = { path = "../../../../../crates/litchi-core" }
litchi-doc = { path = "../../../../../crates/litchi-doc", features = ["performance-diagnostics"] }
litchi-ole-common = { path = "../../../../../crates/litchi-ole-common" }
litchi-ppt = { path = "../../../../../crates/litchi-ppt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[profile.release]
debug = 1
