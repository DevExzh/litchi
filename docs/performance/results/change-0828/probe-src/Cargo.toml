[package]
name = "pptx-edit-profile-0828"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "pptx-edit-profile-0828"
path = "src/main.rs"

[dependencies]
litchi-pptx = { path = "/home/zhuhe/code/litchi/crates/litchi-pptx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
