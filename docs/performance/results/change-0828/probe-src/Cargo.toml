# This is an independent evidence project. The build driver invokes Cargo
# with this manifest explicitly and never adds the probe to the workspace.
[workspace]

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 1
panic = "unwind"
