[dependencies]
litchi-cfb = { path = "/home/zhuhe/code/litchi-worktrees/0787-cached-part-scheduling/crates/litchi-cfb", features = ["write"] }
litchi-core = { path = "/home/zhuhe/code/litchi-worktrees/0787-cached-part-scheduling/crates/litchi-core" }
litchi-opc = { path = "/home/zhuhe/code/litchi-worktrees/0787-cached-part-scheduling/crates/litchi-opc" }
rustix = { version = "1.1.4", default-features = false, features = ["time"] }
