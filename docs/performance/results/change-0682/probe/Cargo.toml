[package]
name = "probe0682"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "probe0682"
path = "src/main.rs"

[dependencies]
litchi-core = { path = "../../../../../crates/litchi-core" }
litchi-docx = { path = "../../../../../crates/litchi-docx" }
litchi-opc = { path = "../../../../../crates/litchi-opc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[profile.release]
debug = 1
