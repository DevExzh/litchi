[package]
name = "xlsx0894-differential-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xlsx0894-probe"
path = "probe.rs"

[dependencies]
litchi-xlsx = { path = "/home/zhuhe/code/litchi/target/litchi-0894-baseline-src/crates/litchi-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# The build driver materializes this template for one immutable source tree at
# a time.  Keeping it outside the workspace prevents the diagnostic probe from
# changing production dependency topology or lockfile state.
[workspace]

[profile.dev]
opt-level = 0
debug = 0
incremental = false
panic = "unwind"
