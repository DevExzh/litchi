[package]
name = "litchi-xlsx-allocation-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
allocator-metrics = []

[[bin]]
name = "xlsx-allocation-probe"
path = "src/main.rs"

[dependencies]
litchi-core = { path = "/home/zhuhe/code/litchi-worktrees/0779-xlsx-allocation-attribution/crates/litchi-core" }
litchi-xlsx = { path = "/home/zhuhe/code/litchi-worktrees/0779-xlsx-allocation-attribution/crates/litchi-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# Keep this project independent from the repository workspace. The caller
# replaces /home/zhuhe/code/litchi-worktrees/0779-xlsx-allocation-attribution with the source-tree root and builds this manifest explicitly.
[workspace]

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 1
panic = "unwind"
