repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        files: '^(.*\.rs|rustfmt\.toml)$'
        pass_filenames: false
      - id: cargo-sort
        name: Check Cargo.toml sorting
        entry: cargo sort --check
        language: system
        files: '(^|/)Cargo\.toml$'
        pass_filenames: false
      - id: cargo-lint
        name: Enforce Rust lint policy
        entry: cargo lint
        language: system
        files: '^(.*\.rs|Cargo\.toml|Cargo\.lock|clippy\.toml|\.cargo/config\.toml)$'
        pass_filenames: false
      - id: cargo-test-lib
        name: Run cargo test (lib and tests)
        entry: cargo test --workspace --all-features --lib --tests
        language: system
        files: '^(.*\.rs|Cargo\.toml|Cargo\.lock)$'
        pass_filenames: false
      - id: cargo-test-doc
        name: Run cargo test (doc tests)
        entry: cargo test --workspace --all-features --doc
        language: system
        files: '^(.*\.rs|Cargo\.toml|Cargo\.lock)$'
        pass_filenames: false
